<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F4F3EF">
  <title>문지혜 | 백엔드 개발자 포트폴리오</title>
  <meta name="description" content="최적을 추구하며 파고드는 백엔드 개발자 문지혜의 포트폴리오입니다.">
  <script>
    // 첫 페인트 전에 테마 적용 (깜빡임 방지)
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="top"></div>

  <header class="nav" id="nav">
    <div class="nav-inner" id="navInner"></div>
  </header>

  <main id="mainContent"></main>

  <footer class="footer" id="footerContent"></footer>

  <script src="script.js"></script>
</body>
</html>
